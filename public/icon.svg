<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#E8EDF2"/>

  <!-- Antenna stem -->
  <rect x="244" y="72" width="24" height="72" rx="12" fill="#607D8B"/>
  <!-- Antenna ball -->
  <circle cx="256" cy="60" r="28" fill="#607D8B"/>

  <!-- Head -->
  <rect x="104" y="144" width="304" height="248" rx="48" fill="#B0BEC5"/>

  <!-- Face plate -->
  <rect x="128" y="168" width="256" height="200" rx="32" fill="#ECEFF1"/>

  <!-- Eyes dark surround -->
  <rect x="148" y="200" width="88" height="72" rx="18" fill="#263238"/>
  <rect x="276" y="200" width="88" height="72" rx="18" fill="#263238"/>
  <!-- Eyes blue iris -->
  <rect x="156" y="208" width="72" height="56" rx="12" fill="#1565C0"/>
  <rect x="284" y="208" width="72" height="56" rx="12" fill="#1565C0"/>
  <!-- Pupils -->
  <circle cx="192" cy="236" r="16" fill="#0D47A1"/>
  <circle cx="320" cy="236" r="16" fill="#0D47A1"/>
  <!-- Eye shine -->
  <circle cx="200" cy="227" r="7" fill="white" opacity="0.7"/>
  <circle cx="328" cy="227" r="7" fill="white" opacity="0.7"/>

  <!-- Mouth panel -->
  <rect x="164" y="304" width="184" height="36" rx="10" fill="#B0BEC5"/>
  <!-- Mouth grill lines -->
  <rect x="172" y="312" width="168" height="20" rx="6" fill="#90A4AE"/>
  <line x1="212" y1="312" x2="212" y2="332" stroke="#B0BEC5" stroke-width="4"/>
  <line x1="248" y1="312" x2="248" y2="332" stroke="#B0BEC5" stroke-width="4"/>
  <line x1="284" y1="312" x2="284" y2="332" stroke="#B0BEC5" stroke-width="4"/>
  <line x1="320" y1="312" x2="320" y2="332" stroke="#B0BEC5" stroke-width="4"/>

  <!-- Ear bolts -->
  <circle cx="104" cy="248" r="26" fill="#90A4AE"/>
  <circle cx="104" cy="248" r="13" fill="#607D8B"/>
  <circle cx="408" cy="248" r="26" fill="#90A4AE"/>
  <circle cx="408" cy="248" r="13" fill="#607D8B"/>

  <!-- Magnifying glass (bottom-right) -->
  <circle cx="358" cy="390" r="52" fill="#1565C0"/>
  <circle cx="358" cy="390" r="38" fill="#E3F2FD"/>
  <circle cx="358" cy="390" r="26" fill="#1565C0" opacity="0.15"/>
  <line x1="388" y1="420" x2="420" y2="454" stroke="#1565C0" stroke-width="18" stroke-linecap="round"/>
</svg>
