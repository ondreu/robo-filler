services:
  robo-filler-api:
    build: .
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PORT=3001
      - CORS_ORIGIN=https://ondreu.github.io
      - DATA_DIR=/app/data
    volumes:
      - ../public:/app/data:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - robo-filler-api
    restart: unless-stopped
