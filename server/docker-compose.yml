services:
  robo-filler-api:
    image: ghcr.io/ondreu/robo-filler-server:latest
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=3001
      - CORS_ORIGIN=https://ondreu.github.io
    volumes:
      - ./logs:/app/logs
      # Perzistentní databáze (wires/cables/kanban.json + schémata) — editace
      # přes admin se ukládají sem a přežijí restart i auto-update image.
      - ./data:/app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - robo-filler-api
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
    restart: unless-stopped
